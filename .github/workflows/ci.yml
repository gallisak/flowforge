name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Integration tests (Testcontainers / Postgres 16)
        run: npm run test:int
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: apps/frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create env files from the examples
        run: |
          cp apps/api/.env.example apps/api/.env
          sed -e "s/^ADMIN_TOKEN=$/ADMIN_TOKEN=$(openssl rand -hex 32)/" \
              -e "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^FLOWFORGE_OWNER_PASSWORD=$/FLOWFORGE_OWNER_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^FLOWFORGE_APP_PASSWORD=$/FLOWFORGE_APP_PASSWORD=$(openssl rand -hex 24)/" \
              .env.example > .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.chaos.yml config --quiet
      - run: docker compose build
