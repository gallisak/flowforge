services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
      FLOWFORGE_OWNER_PASSWORD: ${FLOWFORGE_OWNER_PASSWORD:-flowforge_owner}
      FLOWFORGE_APP_PASSWORD: ${FLOWFORGE_APP_PASSWORD:-flowforge_app}
    ports: ['${PG_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/provision.sql:/flowforge/provision.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U flowforge -d flowforge']
      interval: 3s
      retries: 20

  migrate:
    build: ./apps/api
    command: ['node', 'dist/migrate']
    env_file: ./apps/api/.env.example
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: ./apps/api
    env_file: ./apps/api/.env.example
    depends_on:
      migrate: { condition: service_completed_successfully }
    init: true
    ports: ['${API_PORT:-3000}:3000']

  worker:
    build: ./apps/api
    command: ['node', 'dist/worker']
    init: true
    stop_grace_period: 30s
    env_file: ./apps/api/.env.example
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2

  frontend:
    build: ./apps/frontend
    environment:
      API_URL: http://api:3000
    depends_on: [api]
    init: true
    ports: ['${WEB_PORT:-3001}:3000']

volumes:
  pgdata:
