x-database-urls:
  app: &app-database-url postgres://flowforge_app:${FLOWFORGE_APP_PASSWORD:?set FLOWFORGE_APP_PASSWORD in .env}@postgres:5432/flowforge
  owner: &owner-database-url postgres://flowforge_owner:${FLOWFORGE_OWNER_PASSWORD:?set FLOWFORGE_OWNER_PASSWORD in .env}@postgres:5432/flowforge

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

x-ops-healthcheck: &ops-healthcheck
  test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9100/health/ready || exit 1']
  interval: 5s
  timeout: 3s
  retries: 6
  start_period: 10s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: flowforge
      FLOWFORGE_OWNER_PASSWORD: ${FLOWFORGE_OWNER_PASSWORD:?set FLOWFORGE_OWNER_PASSWORD in .env}
      FLOWFORGE_APP_PASSWORD: ${FLOWFORGE_APP_PASSWORD:?set FLOWFORGE_APP_PASSWORD in .env}
    ports: ['127.0.0.1:${PG_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/provision.sql:/flowforge/provision.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U flowforge -d flowforge']
      interval: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  migrate:
    build: ./apps/api
    image: flowforge-api:local
    command: ['node', 'dist/migrate']
    env_file: ./apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ''
      MIGRATION_DATABASE_URL: *owner-database-url
      ADMIN_TOKEN: ''
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    logging: *logging

  api:
    image: flowforge-api:local
    pull_policy: never
    env_file: ./apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: *app-database-url
      MIGRATION_DATABASE_URL: ''
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env to a random secret of at least 32 characters}
      CLIENT_ADDRESS_SECRET: ${CLIENT_ADDRESS_SECRET:?set CLIENT_ADDRESS_SECRET in .env to a random secret of at least 32 characters}
    depends_on:
      migrate: { condition: service_completed_successfully }
    init: true
    ports: ['127.0.0.1:${API_PORT:-3000}:3000']
    healthcheck: *ops-healthcheck
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging

  worker:
    image: flowforge-api:local
    pull_policy: never
    command: ['node', 'dist/worker']
    init: true
    stop_grace_period: 30s
    env_file: ./apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: *app-database-url
      MIGRATION_DATABASE_URL: ''
      ADMIN_TOKEN: ''
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: *ops-healthcheck
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging
    deploy:
      replicas: 2

  scheduler:
    image: flowforge-api:local
    pull_policy: never
    command: ['node', 'dist/scheduler']
    init: true
    stop_grace_period: 30s
    env_file: ./apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: *app-database-url
      MIGRATION_DATABASE_URL: ''
      ADMIN_TOKEN: ''
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: *ops-healthcheck
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    deploy:
      replicas: 2

  frontend:
    build: ./apps/frontend
    environment:
      API_URL: http://api:3000
      APP_ORIGIN: ${APP_ORIGIN:-}
      CLIENT_ADDRESS_SECRET: ${CLIENT_ADDRESS_SECRET:?set CLIENT_ADDRESS_SECRET in .env to a random secret of at least 32 characters}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    depends_on:
      api: { condition: service_healthy }
    init: true
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./docker/edge/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend: { condition: service_healthy }
    ports: ['127.0.0.1:${WEB_PORT:-3001}:8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
